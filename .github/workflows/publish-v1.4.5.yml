name: Publish verified v1.4.5 downloads
on:
  push:
    branches: [release-upload-v1.4.5]
permissions:
  contents: write
concurrency:
  group: release-v1.4.5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify downloads
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/windows.part* > ChessAsh-Setup-1.4.5.exe
          cp .release-upload/ChessAsh-1.4.5-android.apk .
          cp .release-upload/ChessAsh-1.4.5-SHA256SUMS.txt .
          sha256sum -c ChessAsh-1.4.5-SHA256SUMS.txt
          target=$(cat .release-upload/target.txt)
          test "$target" = "$(git rev-parse origin/main)"
          test "$(git show "$target:package.json" | jq -r .version)" = 1.4.5
          git diff --exit-code "$target" HEAD -- . ':(exclude).release-upload' ':(exclude).gitignore'
      - name: Publish v1.4.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(cat .release-upload/target.txt)
          gh release create V1.4.5 ChessAsh-Setup-1.4.5.exe ChessAsh-1.4.5-android.apk ChessAsh-1.4.5-SHA256SUMS.txt --target "$target" --title V1.4.5 --notes-file docs/releases/V1.4.5.md --latest
      - name: Remove temporary upload branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/release-upload-v1.4.5
