name: Publish verified v1.1 downloads
on:
  push:
    branches: [release-upload-v1.1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify downloads
        shell: bash
        run: |
          cat .release-upload/windows.part* > ChessAsh-Setup-1.1.0.exe
          cp .release-upload/ChessAsh-1.1.0-android.apk .
          cp .release-upload/SHA256SUMS.txt .
          sha256sum -c SHA256SUMS.txt
      - name: Publish v1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(cat .release-upload/target.txt)
          gh release create V1.1 ChessAsh-Setup-1.1.0.exe ChessAsh-1.1.0-android.apk SHA256SUMS.txt --target "$target" --title V1.1 --notes-file .release-upload/notes.md
      - name: Remove temporary upload branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/release-upload-v1.1
