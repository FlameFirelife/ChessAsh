[package]
name = "chessash-persistence"
version = "1.7.5"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chessash-review-core = { path = "../review-core" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
windows-sys = { version = "0.60", features = ["Win32_Security_Cryptography"] }
